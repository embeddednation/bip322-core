[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bip322"
version = "0.3.1"
description = "BIP-322 (simple / full) message signing tooling for P2WSH multisig quorums: PSBT creation, finalization and verification"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "embit>=0.8.0",
    "btclib>=2026.9.10",
]

[project.optional-dependencies]
kernel = ["py-bitcoinkernel>=0.1.0a5"]
dev = ["pytest>=8"]

[project.scripts]
bip322 = "bip322.cli:main"
bip322-dev = "bip322.dev.cli:main"
bip322-refcheck = "refcheck.verify_one:main"
bip322-audit = "bip322audit.cli:main"

[tool.setuptools.packages.find]
include = ["bip322*", "bip322audit*", "refcheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["E501"]
