[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bip322-core"
version = "0.5.1"
description = "BIP-322 message signing and verification for descriptor wallets (P2WSH multisig, P2WPKH): PSBTs for hardware signers, finalization, a verifier cross-checked against btcd, Knots, Core and btclib"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "embit>=0.8.0",
    "btclib>=2026.9.10",
]

[project.optional-dependencies]
kernel = ["py-bitcoinkernel>=0.1.0a5"]
dev = ["pytest>=8"]

[project.scripts]
bip322 = "bip322core.cli:main"
bip322-dev = "bip322core.dev.cli:main"
bip322-refcheck = "refcheck.verify_one:main"

[tool.setuptools.packages.find]
include = ["bip322core*", "refcheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["E501"]
